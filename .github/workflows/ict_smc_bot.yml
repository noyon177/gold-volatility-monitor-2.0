name: ICT SMC Market Reader

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub minimum)
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        default: once
        options:
          - once      # single scan
          - report    # send the daily report now
          - backtest  # run backtest

# prevent two runs at the same time
concurrency:
  group: ict-smc-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install requests

      # keep state files (duplicate-alert / daily-report tracking) between runs
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            ict_smc_state_v2.json
            ict_smc_trades_v2.jsonl
            .ict_smc_cache
          key: ict-smc-state-${{ github.run_id }}
          restore-keys: |
            ict-smc-state-

      - name: Run bot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # daily report: 1 PM at UTC+6 (change if needed)
          DAILY_REPORT_TIME: "13:00"
          DAILY_REPORT_TZ: "6"
          DAILY_REPORT_GRACE_MIN: "180"
        run: |
          MODE="${{ github.event.inputs.mode || 'once' }}"
          case "$MODE" in
            report)   python ict_smc_market_reader_v2.py --report ;;
            backtest) python ict_smc_market_reader_v2.py --backtest ;;
            *)        python ict_smc_market_reader_v2.py --once ;;
          esac

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ict_smc_state_v2.json
            ict_smc_trades_v2.jsonl
            .ict_smc_cache
          key: ict-smc-state-${{ github.run_id }}
