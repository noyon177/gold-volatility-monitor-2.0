name: ICT SMC Market Reader

# Place this file at: .github/workflows/ict_smc_market_reader.yml
# Place the script at the repository root: ict_smc_market_reader_v2.py
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   TWELVE_DATA_API_KEY
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID

on:
  schedule:
    # Every 15 minutes, offset by 2 minutes so the 15M candle is already
    # closed and available from the data provider when the script runs.
    # GitHub cron is in UTC and may start several minutes late.
    - cron: "2,17,32,47 * * * *"

  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a Telegram test message only (no market scan)"
        type: boolean
        default: false
      send_status_updates:
        description: "Send hourly NO TRADE / bot alive status messages"
        type: boolean
        default: true

# Never run two scans at the same time (protects the state file and API quota).
concurrency:
  group: ict-smc-market-reader
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    name: Scan markets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEND_STATUS_UPDATES: ${{ github.event_name == 'workflow_dispatch' && (inputs.send_status_updates && '1' || '0') || '1' }}
      TEST_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram && '1' || '0' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # The script stores duplicate-signal protection and hourly status
      # markers in ict_smc_state.json. Restore the latest copy before the run.
      - name: Restore state file
        uses: actions/cache/restore@v4
        with:
          path: ict_smc_state.json
          key: ict-smc-state-${{ github.run_id }}
          restore-keys: |
            ict-smc-state-

      - name: Run ICT SMC Market Reader
        run: python ict_smc_market_reader_v2.py

      # Save the updated state even if the run failed part-way through.
      - name: Save state file
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ict_smc_state.json
          key: ict-smc-state-${{ github.run_id }}
