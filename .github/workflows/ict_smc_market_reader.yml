name: ICT SMC Market Reader

# Put this file at: .github/workflows/ict_smc_market_reader.yml
# Put ict_smc_market_reader_v7_1.py in the repo root (same folder level as .github).

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub may start a few minutes late; the script catches up)
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = normal run, test = Telegram test message, report = send report now"
        type: choice
        default: scan
        options:
          - scan
          - test
          - report

permissions:
  contents: read

# Never run two scans at the same time (they share the state file).
concurrency:
  group: ict-smc-reader
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install requests

      # State file (open trades, cooldowns, API-credit counter) is kept between runs via cache.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: ict_smc_state.json
          key: ict-smc-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ict-smc-state-

      - name: Run reader
        env:
          # ---- Secrets (required) ----
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          STATE_FILE: ict_smc_state.json

          # ---- Manual run modes ----
          TEST_TELEGRAM: ${{ github.event.inputs.mode == 'test' && '1' || '' }}
          SEND_REPORT_NOW: ${{ github.event.inputs.mode == 'report' && '1' || '' }}

          # ---- Optional settings (GitHub: Settings > Secrets and variables > Actions > Variables) ----
          # Empty value = the script's built-in default is used.
          XAU_SPREAD: ${{ vars.XAU_SPREAD }}
          BTC_SPREAD: ${{ vars.BTC_SPREAD }}
          ACCOUNT_BALANCE: ${{ vars.ACCOUNT_BALANCE }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          SCALP_MIN_SCORE: ${{ vars.SCALP_MIN_SCORE }}
          SCALP_MAX_SIGNALS_PER_DAY: ${{ vars.SCALP_MAX_SIGNALS_PER_DAY }}
          DAILY_LOSS_LIMIT_R: ${{ vars.DAILY_LOSS_LIMIT_R }}
          DAILY_GLOBAL_LOSS_LIMIT_R: ${{ vars.DAILY_GLOBAL_LOSS_LIMIT_R }}
          TWELVE_DAILY_LIMIT: ${{ vars.TWELVE_DAILY_LIMIT }}
          SEND_STATUS_UPDATES: ${{ vars.SEND_STATUS_UPDATES }}
          SEND_WATCHLIST: ${{ vars.SEND_WATCHLIST }}
          NEWS_AUTO: ${{ vars.NEWS_AUTO }}
        run: python ict_smc_market_reader_v7_1.py

      - name: Save state
        if: always() && hashFiles('ict_smc_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: ict_smc_state.json
          key: ict-smc-state-${{ github.run_id }}-${{ github.run_attempt }}
