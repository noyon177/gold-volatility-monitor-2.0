name: ICT SMC Scalp Reader

# Place this file at: .github/workflows/ict_smc_market_reader.yml
# Place the script at the repository root: ict_smc_market_reader_v4.py
#
# Required repository secrets:
#   TWELVE_DATA_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#
# How it works: every job stays alive ~55 minutes and scans right after each
# 5M candle closes (+25 s). A new job is queued every 30 minutes, so the next
# one starts as soon as the previous one ends (no gaps, never two at once).
# NOTE: this uses GitHub Actions minutes all day. Public repos are free;
# private repos only get ~2000 free minutes/month.

on:
  schedule:
    - cron: "7,37 * * * *"

  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a Telegram test message only (no market scan)"
        type: boolean
        default: false
      send_status_updates:
        description: "Send hourly NO TRADE / bot alive status messages"
        type: boolean
        default: true

# One job at a time. A waiting job starts the moment the running one ends.
concurrency:
  group: ict-smc-scalp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    name: Scalp scan loop
    runs-on: ubuntu-latest
    timeout-minutes: 62

    env:
      MODE: SCALP
      SCALP_LOOP_MINUTES: "55"
      # Tune without editing the script (defaults shown):
      SCALP_MIN_SCORE: "7"
      SCALP_COOLDOWN_MIN: "15"
      SCALP_MAX_SIGNALS_PER_DAY: "8"
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEND_STATUS_UPDATES: ${{ github.event_name == 'workflow_dispatch' && (inputs.send_status_updates && '1' || '0') || '1' }}
      TEST_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram && '1' || '0' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Restore state file
        uses: actions/cache/restore@v4
        with:
          path: ict_smc_state.json
          key: ict-smc-state-${{ github.run_id }}
          restore-keys: |
            ict-smc-state-

      - name: Run ICT SMC Scalp Reader
        run: python ict_smc_market_reader_v4.py

      - name: Save state file
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ict_smc_state.json
          key: ict-smc-state-${{ github.run_id }}
