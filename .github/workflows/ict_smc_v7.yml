name: ICT SMC Scalp Reader v7

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send only a Telegram test message"
        type: boolean
        default: false
      send_report:
        description: "Send the performance report now"
        type: boolean
        default: false

permissions:
  contents: write

# Never run two scans at the same time (state file safety)
concurrency:
  group: ict-smc-v7
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run ICT SMC reader
        env:
          # ---- Secrets (required) ----
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # ---- Manual run options ----
          TEST_TELEGRAM: ${{ inputs.test_telegram && '1' || '' }}
          SEND_REPORT_NOW: ${{ inputs.send_report && '1' || '' }}

          STATE_FILE: ict_smc_state.json

          # ---- Optional Variables (Settings > Secrets and variables > Actions > Variables)
          # Empty = script default is used
          ACCOUNT_BALANCE: ${{ vars.ACCOUNT_BALANCE }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          XAU_SPREAD: ${{ vars.XAU_SPREAD }}
          BTC_SPREAD: ${{ vars.BTC_SPREAD }}
          XAU_VALUE_PER_LOT: ${{ vars.XAU_VALUE_PER_LOT }}
          BTC_VALUE_PER_LOT: ${{ vars.BTC_VALUE_PER_LOT }}
          SCALP_MIN_SCORE: ${{ vars.SCALP_MIN_SCORE }}
          SCALP_WATCH_MIN_SCORE: ${{ vars.SCALP_WATCH_MIN_SCORE }}
          SCALP_MAX_SIGNALS_PER_DAY: ${{ vars.SCALP_MAX_SIGNALS_PER_DAY }}
          SCALP_COOLDOWN_MIN: ${{ vars.SCALP_COOLDOWN_MIN }}
          SMART_ENTRY: ${{ vars.SMART_ENTRY }}
          SEND_STATUS_UPDATES: ${{ vars.SEND_STATUS_UPDATES }}
          SEND_WATCHLIST: ${{ vars.SEND_WATCHLIST }}
          STATUS_EVERY_HOURS: ${{ vars.STATUS_EVERY_HOURS }}
          XAU_SESSIONS_UTC: ${{ vars.XAU_SESSIONS_UTC }}
          BTC_SESSIONS_UTC: ${{ vars.BTC_SESSIONS_UTC }}
          NEWS_AUTO: ${{ vars.NEWS_AUTO }}
          TWELVE_DAILY_LIMIT: ${{ vars.TWELVE_DAILY_LIMIT }}
        run: python ict_smc_market_reader_v7.py

      - name: Save state (commit)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f ict_smc_state.json ]; then
            git add ict_smc_state.json
            if ! git diff --cached --quiet; then
              git commit -m "state: update ict_smc_state.json"
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              git push || (git pull --rebase origin "${GITHUB_REF_NAME}" && git push)
            fi
          fi
