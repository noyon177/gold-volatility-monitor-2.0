name: Backtest EMA Candle 15m

on:
  workflow_dispatch:   # manual "Run workflow" button in the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run backtest
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python -u backtest_ema_candle_15m_fixed.py | tee result.txt

      - name: Show summary
        if: always()
        run: |
          echo "===== SUMMARY ====="
          sed -n '/^SUMMARY/,$p' result.txt || true

      - name: Save result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-result
          path: result.txt
