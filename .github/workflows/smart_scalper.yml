name: Smart Scalper v1

# Put this file at  .github/workflows/smart_scalper.yml
# Put smart_scalper.py in the repo root.
#
# The bot loops inside one job (scan about once a minute), so it can see 1M candles.
# Three daily starts cover the 07:00-21:00 UTC window (13:00-03:00 Bangladesh time).
on:
  schedule:
    - cron: "50 6 * * *"
    - cron: "45 12 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send only a Telegram test message"
        type: boolean
        default: false
      send_report:
        description: "Send the performance report now"
        type: boolean
        default: false

permissions:
  contents: write

# Never run two loops at the same time (state file safety)
concurrency:
  group: smart-scalper
  cancel-in-progress: false

jobs:
  scalp:
    runs-on: ubuntu-latest
    timeout-minutes: 358

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Smart Scalper
        env:
          # ---- Secrets (required) ----
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # ---- Manual run options ----
          TEST_TELEGRAM: ${{ inputs.test_telegram && '1' || '' }}
          SEND_REPORT_NOW: ${{ inputs.send_report && '1' || '' }}

          STATE_FILE: smart_scalper_state.json
          LOOP_MINUTES: "350"
          GIT_PUSH_STATE: "1"

          # ---- Optional Variables (Settings > Secrets and variables > Actions > Variables)
          # Empty = script default is used
          ACCOUNT_BALANCE: ${{ vars.ACCOUNT_BALANCE }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          XAU_SPREAD: ${{ vars.XAU_SPREAD }}
          BTC_SPREAD: ${{ vars.BTC_SPREAD }}
          XAU_VALUE_PER_LOT: ${{ vars.XAU_VALUE_PER_LOT }}
          BTC_VALUE_PER_LOT: ${{ vars.BTC_VALUE_PER_LOT }}
          SYMBOLS: ${{ vars.SYMBOLS }}
          BTC_SOURCE: ${{ vars.BTC_SOURCE }}               # binance = free, saves Twelve Data credits
          SESSIONS_UTC: ${{ vars.SESSIONS_UTC }}           # default 7-20
          XAU_SESSIONS_UTC: ${{ vars.XAU_SESSIONS_UTC }}
          BTC_SESSIONS_UTC: ${{ vars.BTC_SESSIONS_UTC }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          MIN_RR: ${{ vars.MIN_RR }}
          MAX_RR: ${{ vars.MAX_RR }}
          DAILY_MAX_SL: ${{ vars.DAILY_MAX_SL }}
          DAILY_LOSS_LIMIT_R: ${{ vars.DAILY_LOSS_LIMIT_R }}
          COOLDOWN_AFTER_SL_MIN: ${{ vars.COOLDOWN_AFTER_SL_MIN }}
          MAX_OPEN_PER_SYMBOL: ${{ vars.MAX_OPEN_PER_SYMBOL }}
          MAX_OPEN_TOTAL: ${{ vars.MAX_OPEN_TOTAL }}
          MAX_SIGNALS_PER_DAY: ${{ vars.MAX_SIGNALS_PER_DAY }}
          ZONE_MAX_TOUCHES: ${{ vars.ZONE_MAX_TOUCHES }}
          NEWS_AUTO: ${{ vars.NEWS_AUTO }}
          NEWS_WINDOW_MIN: ${{ vars.NEWS_WINDOW_MIN }}
          LEARN_ON: ${{ vars.LEARN_ON }}
          LEARN_MODE: ${{ vars.LEARN_MODE }}               # auto | advise
          LEARN_MIN_TRADES: ${{ vars.LEARN_MIN_TRADES }}
          SEND_WATCH: ${{ vars.SEND_WATCH }}
          SEND_STATUS_UPDATES: ${{ vars.SEND_STATUS_UPDATES }}
          STATUS_EVERY_HOURS: ${{ vars.STATUS_EVERY_HOURS }}
          TWELVE_DAILY_LIMIT: ${{ vars.TWELVE_DAILY_LIMIT }}
        run: python smart_scalper.py

      - name: Save state (commit)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f smart_scalper_state.json ]; then
            git add smart_scalper_state.json
            if ! git diff --cached --quiet; then
              git commit -m "state: update smart_scalper_state.json"
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              git push || (git pull --rebase origin "${GITHUB_REF_NAME}" && git push)
            fi
          fi
