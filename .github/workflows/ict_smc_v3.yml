name: ICT SMC Market Reader v3

on:
  schedule:
    - cron: "*/15 * * * *"      # swing mode: change to "5 * * * *" (hourly)
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a Telegram test message only"
        type: boolean
        default: false

concurrency:
  group: ict-smc-v3
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests matplotlib

      # The bot keeps open trades, results and stats in ict_smc_state.json,
      # so this file MUST survive between runs.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: ict_smc_state*.json
          key: ict-state-${{ github.run_id }}
          restore-keys: ict-state-

      - name: Run bot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STRATEGY_MODE: scalp              # or: swing
          ACCOUNT_BALANCE: ${{ vars.ACCOUNT_BALANCE }}
          RISK_PERCENT: ${{ vars.RISK_PERCENT }}
          TEST_TELEGRAM: ${{ inputs.test_telegram && '1' || '0' }}
        run: python ict_smc_market_reader_v3.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ict_smc_state*.json
          key: ict-state-${{ github.run_id }}
