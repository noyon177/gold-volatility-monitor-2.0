name: ICT SMC Scalp Reader

on:
  schedule:
        - cron: "1-59/5 * * * *"

  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a Telegram test message only (no market scan)"
        type: boolean
        default: false
      send_status_updates:
        description: "Send NO TRADE / bot alive status messages"
        type: boolean
        default: true
      send_report:
        description: "Send the trade results report only (no scan)"
        type: boolean
        default: false

# Prevent overlapping scans and state-file write conflicts.
concurrency:
  group: ict-smc-scalp
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    name: ICT SMC scan (single run)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MODE: SCALP
      # Keep these aligned with the Python script's defaults/config.
      SCALP_MIN_SCORE: "7"
      SCALP_COOLDOWN_MIN: "15"
      SCALP_MAX_SIGNALS_PER_DAY: "8"
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEND_STATUS_UPDATES: ${{ github.event_name == 'workflow_dispatch' && (inputs.send_status_updates && '1' || '0') || '1' }}
      TEST_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram && '1' || '0' }}
      SEND_REPORT_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.send_report && '1' || '0' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$TWELVE_DATA_API_KEY" || { echo "::error::Missing TWELVE_DATA_API_KEY repository secret"; exit 1; }
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "::error::Missing TELEGRAM_BOT_TOKEN repository secret"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "::error::Missing TELEGRAM_CHAT_ID repository secret"; exit 1; }

      - name: Run ICT SMC Scalp Reader v5.1
        run: python ict_smc_market_reader_v5_1.py

      - name: Persist bot state to repository
        if: always()
        shell: bash
        run: |
          if [ ! -f ict_smc_state.json ]; then
            echo "No state file created; nothing to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ict_smc_state.json

          if git diff --cached --quiet; then
            echo "State file unchanged; no commit needed."
            exit 0
          fi

          git commit -m "chore: persist ICT SMC bot state [skip ci]"
          git push
