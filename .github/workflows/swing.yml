name: Swing Trend Bot

on:
  schedule:
    # Runs once every 4 hours (UTC) â€” checks shortly after each 4H candle closes
    - cron: "5 */4 * * *"
  workflow_dispatch: {}   # allows manual testing from the GitHub Actions tab ("Run workflow")

permissions:
  contents: write   # needed to commit the state file back to the repo

concurrency:
  group: swing-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python swing_bot.py

      - name: Commit state file (if changed)
        run: |
          if [ -f swing_state.json ]; then
            git config user.name "swing-bot"
            git config user.email "swing-bot@users.noreply.github.com"
            git add swing_state.json
            git diff --cached --quiet || git commit -m "swing state update [skip ci]"
            git push
          fi
