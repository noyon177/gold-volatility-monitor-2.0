name: Train ML Filter

# Manual run: GitHub -> Actions -> "Train ML Filter" -> Run workflow
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of history to download"
        default: "180"
      min_score:
        description: "Minimum signal score used for the backtest (lower = more trades)"
        default: "5"

permissions:
  contents: write

concurrency:
  group: ml-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests numpy pandas scikit-learn joblib

      - name: Download history
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python download_data.py --symbol XAU/USD --out xauusd_5m.csv --days ${{ github.event.inputs.days }}
          python download_data.py --symbol BTC/USD --out btcusd_5m.csv --days ${{ github.event.inputs.days }}

      - name: Backtest and build trade dataset
        env:
          SCALP_MIN_SCORE: ${{ github.event.inputs.min_score }}
          BTC_MIN_SCORE: ${{ github.event.inputs.min_score }}
        run: |
          python collect_trades.py --symbol XAUUSD --csv xauusd_5m.csv --out trades_xau.csv --workers $(nproc)
          python collect_trades.py --symbol BTCUSD --csv btcusd_5m.csv --out trades_btc.csv --workers $(nproc)

      - name: Train and validate model
        shell: bash
        run: python train_model.py --trades trades_xau.csv trades_btc.csv --out ml_model.joblib 2>&1 | tee train_log.txt

      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-training-results
          path: |
            train_log.txt
            trades_xau.csv
            trades_btc.csv

      - name: Commit model (only if validation passed)
        if: always()
        run: |
          if [ -f ml_model.joblib ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ml_model.joblib
            git commit -m "update ML model"
            git push || (git pull --rebase -X theirs && git push)
          else
            echo "No model saved: validation failed or too few trades. See train_log.txt."
          fi
