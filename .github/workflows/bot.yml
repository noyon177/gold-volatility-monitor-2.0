name: Smart Session Bot

on:
  schedule:
    - cron: "*/5 7-21 * * 1-5"       # London + New York hours (UTC), weekdays
    - cron: "*/20 22,23,0-4 * * *"   # only to close open trades after the sessions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smart-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          XAU_SPREAD: ${{ vars.XAU_SPREAD }}
          BTC_SPREAD: ${{ vars.BTC_SPREAD }}
        run: python bot.py
      - name: Save journal and state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal.csv state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "journal update"
            git push || (git pull --rebase -X theirs && git push)
          fi
