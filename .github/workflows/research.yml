name: Research and Learn

# Manual run, and automatically on the 1st of every month (re-learns from the newest data).
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history"
        default: "730"
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download history
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          DAYS="${{ github.event.inputs.days }}"; DAYS="${DAYS:-730}"
          python data.py download --symbol XAU/USD --out data/xauusd_5m.csv --days $DAYS
          python data.py download --symbol BTC/USD --out data/btcusd_5m.csv --days $DAYS
      - name: Learn and validate
        env:
          XAU_SPREAD: ${{ vars.XAU_SPREAD }}
          BTC_SPREAD: ${{ vars.BTC_SPREAD }}
        run: python research.py --data data/xauusd_5m.csv:XAUUSD data/btcusd_5m.csv:BTCUSD --fail-closed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-report
          path: report.txt
      - name: Commit model and report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A model.joblib report.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "research update"
            git push || (git pull --rebase -X theirs && git push)
          fi
