name: Gold Volatility Monitor

on:
  schedule:
    - cron: "*/15 * * * *"   # à¦ªà§à¦°à¦¤à¦¿ à§§à§« à¦®à¦¿à¦¨à¦¿à¦Ÿà§‡ à¦…à¦Ÿà§‹à¦®à§‡à¦Ÿà¦¿à¦• à¦šà¦²à¦¬à§‡
  workflow_dispatch: {}       # à¦šà¦¾à¦‡à¦²à§‡ à¦®à§à¦¯à¦¾à¦¨à§à¦¯à¦¼à¦¾à¦²à¦¿ à¦°à¦¾à¦¨ à¦•à¦°à¦¾ à¦¯à¦¾à¦¬à§‡

jobs:
  check-volatility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run volatility check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VOLATILITY_THRESHOLD_PERCENT: "0.5"
          WINDOW_HOURS: "2"
        run: python main.py
