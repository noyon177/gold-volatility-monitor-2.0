name: ICT SMC Market Reader

on:
  schedule:
    # Every 5 minutes (UTC). GitHub may delay scheduled runs.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      send_report_now:
        description: "Send the daily report right now?"
        type: boolean
        default: false

# Prevent overlapping runs
concurrency:
  group: ict-smc-reader
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # ---- Secrets (Repo > Settings > Secrets and variables > Actions) ----
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ---- Settings (edit here) ----
      KILLZONE_FILTER: "false"        # true = turn the killzone filter back on
      DAILY_REPORT: "true"            # daily report on/off
      DAILY_REPORT_TIME: "13:00"      # report time (in the timezone set below)
      DAILY_REPORT_TZ: "6"            # 6 = Bangladesh time (1 PM BDT = 07:00 UTC), 0 = UTC
      DAILY_REPORT_GRACE_MIN: "180"   # still send the report if the run is late, within this many minutes
      NEWS_FILTER: "true"             # blocks nothing if news_events.json does not exist

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests

      # Keeps the state files (duplicate protection, open trades, last report date) between runs
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            ict_smc_state_v2.json
            ict_smc_trades_v2.jsonl
          key: ict-state-${{ github.run_id }}
          restore-keys: |
            ict-state-

      - name: Run reader
        run: |
          if [ "${{ github.event.inputs.send_report_now }}" = "true" ]; then
            python ict_smc_market_reader_v2.py --report
          fi
          python ict_smc_market_reader_v2.py --once

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ict_smc_state_v2.json
            ict_smc_trades_v2.jsonl
          key: ict-state-${{ github.run_id }}
