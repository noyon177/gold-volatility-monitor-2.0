name: SMC Day-Trading Assistant

on:
  # Every 15 minutes, 1 minute after the 15M candle closes
  schedule:
    - cron: "1,16,31,46 * * * *"
  workflow_dispatch:

# Never run two instances at once (prevents duplicate signals)
concurrency:
  group: smc-assistant
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # One scan per run, then exit
      SMC_RUN_FOREVER: "0"
      # No "started" Telegram message on every run
      SMC_STARTUP_MSG: "0"
      # Free plan allows 8 credits/min, so pause between calls
      SMC_REQUEST_GAP_SECONDS: "8"
      # Runs are 15 min apart, so allow a slightly older MSS
      SMC_MAX_SIGNAL_AGE_MIN: "20"
      SMC_MAX_SIGNALS_DAY: "4"
      SMC_MAX_SYMBOL_SIGNALS_DAY: "2"
      SMC_MIN_SCORE: "8"
      SMC_STATE_FILE: smc_day_trading_state.json
      SMC_TRADE_LOG: smc_day_trading_trades.jsonl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # Restore state from the previous run so the same signal is not sent twice
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            smc_day_trading_state.json
            smc_day_trading_trades.jsonl
          key: smc-state-${{ github.run_id }}
          restore-keys: |
            smc-state-

      - name: Run SMC assistant
        run: python smc_day_trading_assistant_v1.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            smc_day_trading_state.json
            smc_day_trading_trades.jsonl
          key: smc-state-${{ github.run_id }}
